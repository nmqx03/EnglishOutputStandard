<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ôn Thi Tiếng Anh – HUMG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HOME -->
  <div id="home-screen">
    <div class="home-bg"></div>
    <header class="home-header">
      <div class="logo-badge">HUMG</div>
      <h1>Ôn Chuẩn Đầu Ra<br><span>Ngoại Ngữ</span></h1>
      <p class="subtitle">Bộ 20 đề · Khoanh đáp án · Điền bài · Tự chấm điểm</p>
    </header>
    <div class="exam-grid" id="exam-grid"></div>
    <footer class="home-footer">Fb: Chu Hiền Anh · 0337082255</footer>
  </div>

  <!-- EXAM SCREEN -->
  <div id="exam-screen" class="hidden">
    <nav class="exam-nav">
      <button id="btn-back" class="btn-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Danh sách đề
      </button>
      <div class="nav-center">
        <span id="nav-title">Đề 1</span>
        <div class="nav-tabs">
          <button class="nav-tab active" data-tab="exam">📄 Đề thi</button>
          <button class="nav-tab" data-tab="answer">📝 Bài làm</button>
        </div>
      </div>
      <div class="nav-right">
        <div class="score-badge hidden" id="score-badge"><span id="score-text">0/0</span></div>
        <button class="btn-submit" id="btn-submit">Nộp bài</button>
        <button class="btn-icon-nav" id="btn-reset" title="Làm lại">↺</button>
      </div>
    </nav>

    <div class="exam-body">
      <!-- LEFT: PDF Viewer -->
      <div class="exam-panel" id="panel-exam">
        <div class="panel-toolbar">
          <button class="tool-btn" id="btn-prev-page" disabled>◀</button>
          <span id="page-indicator" class="page-ind">1 / 10</span>
          <button class="tool-btn" id="btn-next-page">▶</button>
          <div class="tb-sep"></div>
          <button class="tool-btn" id="btn-zoom-out">−</button>
          <span id="zoom-val">100%</span>
          <button class="tool-btn" id="btn-zoom-in">+</button>
        </div>
        <div class="pdf-viewer" id="pdf-viewer">
          <div class="pdf-img-wrap" id="pdf-img-wrap">
            <img id="pdf-img" src="" alt="Đề thi" draggable="false">
          </div>
        </div>
        <div class="thumb-strip" id="thumb-strip"></div>
      </div>

      <!-- RIGHT: Answer Sheet -->
      <div class="answer-panel" id="panel-answer">
        <div class="answer-hdr">
          <h3>📋 Phiếu trả lời</h3>
          <span class="answer-status" id="answer-status">0/0 câu</span>
        </div>
        <div class="answer-content" id="answer-content"></div>
        <div class="result-panel hidden" id="result-panel">
          <div class="result-circle-wrap">
            <svg class="result-svg" viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="10"/>
              <circle id="result-arc" cx="60" cy="60" r="50" fill="none" stroke="#f59e0b" stroke-width="10"
                stroke-dasharray="314" stroke-dashoffset="314" stroke-linecap="round"
                transform="rotate(-90 60 60)" style="transition:stroke-dashoffset 1.2s ease"/>
            </svg>
            <div class="result-center">
              <span id="result-pct">0%</span><small>điểm</small>
            </div>
          </div>
          <div class="result-stats">
            <div class="stat-item correct">✅ Đúng <strong id="res-correct">0</strong></div>
            <div class="stat-item wrong">❌ Sai <strong id="res-wrong">0</strong></div>
            <div class="stat-item skip">⬜ Bỏ <strong id="res-skip">0</strong></div>
          </div>
          <div class="result-actions">
            <button class="btn-review" id="btn-review">👁 Xem đáp án</button>
            <button class="btn-retry" id="btn-retry">🔄 Làm lại</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Submit modal -->
  <div class="modal-overlay hidden" id="modal-submit">
    <div class="modal">
      <div class="modal-icon">📤</div>
      <h3>Nộp bài kiểm tra?</h3>
      <p>Còn <strong id="unanswered-count" class="warn-text">0</strong> câu chưa trả lời.</p>
      <div class="modal-btns">
        <button class="modal-btn secondary" id="modal-cancel">Tiếp tục làm</button>
        <button class="modal-btn primary" id="modal-confirm">✅ Nộp bài</button>
      </div>
    </div>
  </div>

  <script src="exam_data.js"></script>
  <script src="questions_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
